<head>

<title>مصاريف</title>
<!-- iOS reads its home-screen icon ONLY from apple-touch-icon; the manifest
     icons are not used there. This tag was missing, so iOS fell back to a
     page screenshot. Full-bleed squares: iOS applies its own corner mask. -->
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="apple-touch-icon" sizes="167x167" href="icons/apple-touch-icon-167.png" />
<link rel="apple-touch-icon" sizes="152x152" href="icons/apple-touch-icon-152.png" />
<link rel="apple-touch-icon" sizes="120x120" href="icons/apple-touch-icon-120.png" />
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
<link rel="manifest" href="manifest.json" />
<link rel="preload" href="fonts/plex-arabic-arabic-400.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="fonts/plex-arabic-latin-600.woff2" as="font" type="font/woff2" crossorigin />

<link rel="stylesheet" href="tokens.css" />
<link rel="stylesheet" href="app.css" />
</head>
<body>
<!--
  DIRECTION CONTRACT · seed 2c7456a5 · mode operate
  THESIS: One question answered on sight — "can I spend this?" Refuses the
    feature-per-section dashboard the old build became, where twelve zones
    competed at equal weight.
  OWN-WORLD: Premium personal-finance canon, played straight at Copilot/Monarch
    craft. Cool paper ground, graphite ink, a single violet-indigo accent;
    semantic green/red reserved for money direction only. IBM Plex Sans Arabic,
    tabular lining figures, tight tracking. Layered shadows with real offset.
  STORY: Ahmed opens the app at a till. He sees what he can spend today, any
    decision waiting on him, then the month, then the ledger. Nothing else
    competes.
  FIRST VIEWPORT: One stacked figure panel — cycle label, balance, and today's
    allowance as one unit, not two sections. Beneath it, decisions only when
    they exist. Capture is the primary action, pinned bottom.
  FORM: canon (standing exit), taken by the user over the dealt direction;
    grounded list position n/a. Craft bar: Copilot Money / Monarch.
  FINISH: unreviewed and undocumented is unfinished; this build ends with the
    finish review, the verdict, and DESIGN.md
-->
<div id="root"></div>
<script>
  // Synchronous, before first paint: reading the choice from IndexedDB is
  // async and would flash the wrong theme, so the last choice is mirrored to
  // localStorage purely as a paint-time hint. IndexedDB stays the source of
  // truth and corrects this a moment later if they ever disagree.
  try {
    var t = localStorage.getItem('masareef-theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) { /* private mode; fall through to the system theme */ }
</script>
<script type="module" src="app.js"></script>
</body>
</html>
